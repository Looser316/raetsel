<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXIT Rätsel - Das Symbol-Schloss</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: rgba(42, 42, 42, 0.9);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
            text-align: center;
            max-width: 450px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h1 {
            color: #ff9800;
            margin-top: 0;
        }
        p {
            color: #cccccc;
            font-size: 15px;
        }
        .symbol-display {
            font-size: 35px;
            background: #1a1a1a;
            padding: 15px;
            border-radius: 8px;
            border: 2px solid #555;
            margin: 20px 0;
            letter-spacing: 15px;
            min-height: 50px;
        }
        .button-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .symbol-btn {
            font-size: 28px;
            padding: 15px;
            cursor: pointer;
            background-color: #333;
            border: 1px solid #555;
            border-radius: 8px;
            transition: background 0.2s, transform 0.1s;
        }
        .symbol-btn:hover {
            background-color: #444;
            transform: translateY(-2px);
        }
        .action-btn {
            padding: 10px 20px;
            font-size: 15px;
            cursor: pointer;
            background-color: #ff9800;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            margin: 5px;
        }
        .action-btn:hover {
            background-color: #e68900;
        }
        .btn-clear {
            background-color: #d32f2f;
        }
        .btn-clear:hover {
            background-color: #b71c1c;
        }
        #result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🔐 Das Symbol-Schloss</h1>
        <p>Kombiniere die 3 richtigen Symbole, um das Schloss zu knacken!</p>
        
        <!-- Anzeige des eingegebenen Codes -->
        <div class="symbol-display" id="display">___</div>
        
        <!-- Symbol-Auswahl -->
        <div class="button-grid">
            <button class="symbol-btn" onclick="addSymbol('⭐')">⭐</button>
            <button class="symbol-btn" onclick="addSymbol('🗝️')">🗝️</button>
            <button class="symbol-btn" onclick="addSymbol('🌙')">🌙</button>
            <button class="symbol-btn" onclick="addSymbol('💀')">💀</button>
            <button class="symbol-btn" onclick="addSymbol('🧪')">🧪</button>
            <button class="symbol-btn" onclick="addSymbol('👁️')">👁️</button>
        </div>
        
        <!-- Steuerungs-Buttons -->
        <div>
            <button class="action-btn btn-clear" onclick="clearCode()">Löschen</button>
            <button class="action-btn" onclick="checkCode()">Überprüfen</button>
        </div>
        
        <!-- Ergebnis -->
        <p id="result"></p>
    </div>

    <script>
        let currentCode = [];
        const maxCodeLength = 3;
        const secretCode = "⭐🗝️🌙"; // Der richtige Code (Stern, Schlüssel, Mond)

        function addSymbol(symbol) {
            if (currentCode.length < maxCodeLength) {
                currentCode.push(symbol);
                updateDisplay();
            }
        }

        function clearCode() {
            currentCode = [];
            updateDisplay();
            document.getElementById('result').textContent = "";
        }

        function updateDisplay() {
            let displayString = "";
            for (let i = 0; i < maxCodeLength; i++) {
                displayString += currentCode[i] || "_";
            }
            document.getElementById('display').textContent = displayString;
        }

        function checkCode() {
            const userCode = currentCode.join("");
            const result = document.getElementById('result');

            if (currentCode.length < maxCodeLength) {
                result.style.color = "#ff9800";
                result.textContent = "⚠️ Bitte wähle 3 Symbole aus!";
                return;
            }

            if (userCode === secretCode) {
                result.style.color = "#4CAF50";
                result.textContent = "🎉 Richtig! Das Schloss springt auf!";
            } else {
                result.style.color = "#F44336";
                result.textContent = "❌ Falsch! Das Schloss bleibt verschlossen.";
            }
        }
    </script>

</body>
</html>
