<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXIT – Das Online-Abenteuer</title>
    <style>
        :root {
            --bg-color: #0d0f12;
            --panel-bg: #161922;
            --accent-color: #d4af37; /* Mystisches Gold */
            --accent-hover: #f39c12;
            --error-color: #e74c3c;
            --success-color: #2ecc71;
            --text-color: #e0e0e0;
            --text-muted: #888888;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: radial-gradient(circle at center, #1b202c 0%, var(--bg-color) 100%);
        }

        .container {
            width: 100%;
            max-width: 550px;
            background-color: var(--panel-bg);
            border: 2px solid #2a2f40;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            padding: 30px;
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--accent-color), transparent);
        }

        /* Tipp-Button oben rechts */
        .tip-btn-container {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }

        .tip-toggle-btn {
            background: none;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 5px 12px;
            font-size: 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tip-toggle-btn:hover {
            background-color: var(--accent-color);
            color: #000;
        }

        h1 {
            text-align: center;
            font-size: 1.8rem;
            color: var(--accent-color);
            margin-bottom: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        .code-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Klickbare Symbol-Leiste */
        .symbol-palette {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 5px;
        }

        .symbol-btn {
            background-color: #0b0d12;
            border: 1px solid #333a4d;
            color: var(--accent-color);
            font-size: 1.2rem;
            width: 45px;
            height: 45px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .symbol-btn:hover {
            border-color: var(--accent-color);
            background-color: #1f2433;
            transform: translateY(-2px);
        }

        .input-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        input[type="text"] {
            flex: 1;
            background-color: #0b0d12;
            border: 2px solid #333a4d;
            border-radius: 8px;
            color: var(--accent-color);
            font-size: 1.3rem;
            text-align: center;
            letter-spacing: 3px;
            padding: 10px;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        .submit-btn {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: bold;
            padding: 0 20px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .submit-btn:hover {
            background-color: var(--accent-hover);
        }

        /* Aktionen für Löschen */
        .action-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
        }

        .clear-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            text-decoration: underline;
        }

        .clear-btn:hover {
            color: var(--error-color);
        }

        /* Nachrichten- und Kartenbereich */
        .message-box {
            margin-top: 20px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .alert {
            width: 100%;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            animation: fadeIn 0.4s ease-in-out;
        }

        .alert.error {
            background-color: rgba(231, 76, 60, 0.15);
            border: 1px solid var(--error-color);
            color: var(--error-color);
        }

        .solution-card {
            width: 100%;
            background-color: #1f2433;
            border: 1px solid var(--accent-color);
            border-radius: 8px;
            padding: 20px;
            animation: fadeIn 0.5s ease-in-out;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.1);
        }

        .solution-card h3 {
            color: var(--accent-color);
            margin-bottom: 8px;
            font-size: 1.2rem;
            border-bottom: 1px solid #333a4d;
            padding-bottom: 5px;
        }

        .solution-card p {
            color: var(--text-color);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        /* Modal für Tipps */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background-color: var(--panel-bg);
            border: 2px solid var(--accent-color);
            padding: 25px;
            border-radius: 12px;
            max-width: 400px;
            width: 90%;
            position: relative;
        }

        .modal-content h3 {
            color: var(--accent-color);
            margin-bottom: 15px;
        }

        .modal-content ul {
            margin-left: 20px;
            margin-bottom: 20px;
            color: var(--text-color);
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .close-modal {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            float: right;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Tipp-Button -->
        <div class="tip-btn-container">
            <button class="tip-toggle-btn" onclick="toggleTips(true)">💡 Hinweise anzeigen</button>
        </div>

        <h1>EXIT – Das Rätsel</h1>
        <p class="subtitle">Klicke Symbole an, um den 3er-Code einzugeben.</p>
        
        <div class="code-form">
            <!-- Symbol-Auswahl zum Anklicken -->
            <div class="symbol-palette">
                <button class="symbol-btn" onclick="appendSymbol('◯')">◯</button>
                <button class="symbol-btn" onclick="appendSymbol('△')">△</button>
                <button class="symbol-btn" onclick="appendSymbol('⭐')">⭐</button>
                <button class="symbol-btn" onclick="appendSymbol('▢')">▢</button>
            </div>

            <div class="input-group">
                <input type="text" id="codeInput" readonly placeholder="---">
                <button class="submit-btn" onclick="checkCode()">Öffnen</button>
            </div>

            <div class="action-row">
                <button class="clear-btn" onclick="clearCode()">Eingabe löschen</button>
            </div>
        </div>

        <div class="message-box" id="messageBox">
            <!-- Hier erscheinen Fehlermeldungen oder Lösungskarten -->
        </div>
    </div>

    <!-- Tipp-Modal (Popup) -->
    <div class="modal" id="tipModal">
        <div class="modal-content">
            <h3>Geheime Hinweise</h3>
            <ul>
                <li><strong>Tipp 1:</strong> Zähle die Ecken der geometrischen Formen im Bilderrätsel.</li>
                <li><strong>Tipp 2:</strong> Der Stern zeigt immer nach Norden – vielleicht ist die Reihenfolge wichtig?</li>
            </ul>
            <button class="close-modal" onclick="toggleTips(false)">Schließen</button>
        </div>
    </div>

    <script>
        // Definition der verschiedenen Code-Kombinationen (jetzt mit Symbolen)
        const codes = {
            "◯△⭐": {
                title: "Lösungskarte A – Das mystische Siegel",
                text: "Das Siegel bricht auf! Du hörst ein schweres Rumpeln im Hintergrund. Ein geheimer Durchgang tut sich auf."
            },
            "⭐▢◯": {
                title: "Lösungskarte B – Die Schatulle",
                text: "Ein leises 'Klick' ertönt. Der Deckel der Schatulle hebt sich und gibt eine alte Pergamentrolle frei."
            },
            "△△◯": {
                title: "Lösungskarte C – Der Spiegel",
                text: "Die Reflexion im Spiegel verändert sich und zeigt dir plötzlich Symbole, die vorher unsichtbar waren."
            }
        };

        // Funktion zum Hinzufügen von Symbolen (max. 3 Zeichen/Symbole)
        function appendSymbol(symbol) {
            const inputField = document.getElementById("codeInput");
            if (inputField.value.length < 3) {
                inputField.value += symbol;
            }
        }

        // Funktion zum Zurücksetzen der Eingabe
        function clearCode() {
            document.getElementById("codeInput").value = "";
            document.getElementById("messageBox").innerHTML = "";
        }

        // Tipp-Fenster öffnen/schließen
        function toggleTips(show) {
            const modal = document.getElementById("tipModal");
            modal.style.display = show ? "flex" : "none";
        }

        // Code überprüfen
        function checkCode() {
            const inputField = document.getElementById("codeInput");
            const messageBox = document.getElementById("messageBox");
            const enteredCode = inputField.value.trim();

            if (enteredCode.length < 3) {
                messageBox.innerHTML = `<div class="alert error">Der Code muss aus 3 Symbolen bestehen!</div>`;
                return;
            }

            if (codes[enteredCode]) {
                const card = codes[enteredCode];
                messageBox.innerHTML = `
                    <div class="solution-card">
                        <h3>${card.title}</h3>
                        <p>${card.text}</p>
                    </div>
                `;
            } else {
                messageBox.innerHTML = `<div class="alert error">Falsch! Dieser Code bewirkt nichts. Suche weiter.</div>`;
            }
        }
    </script>

</body>
</html>
