<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXIT – Das Online-Abenteuer</title>
    <style>
        :root {
            --bg-color: #0d0f12;
            --panel-bg: #161922;
            --accent-color: #d4af37;
            --accent-hover: #f39c12;
            --error-color: #e74c3c;
            --text-color: #e0e0e0;
            --text-muted: #888888;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: radial-gradient(circle at center, #1b202c 0%, var(--bg-color) 100%);
        }

        .container {
            width: 100%;
            max-width: 600px;
            background-color: var(--panel-bg);
            border: 2px solid #2a2f40;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            padding: 30px;
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--accent-color), transparent);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .tip-toggle-btn {
            background: none;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 5px 10px;
            font-size: 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tip-toggle-btn:hover {
            background-color: var(--accent-color);
            color: #000;
        }

        h1 {
            font-size: 1.5rem;
            color: var(--accent-color);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        /* Rätsel-Symbol Auswahl */
        .section-label {
            font-size: 0.85rem;
            color: var(--accent-color);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .puzzle-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .puzzle-tab {
            flex: 1;
            background-color: #0b0d12;
            border: 2px solid #333a4d;
            color: var(--text-muted);
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            font-size: 1.1rem;
            transition: all 0.2s;
        }

        .puzzle-tab.active {
            border-color: var(--accent-color);
            color: var(--accent-color);
            background-color: #1f2433;
        }

        /* Code-Eingabe Bereich */
        .code-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .symbol-palette {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .symbol-btn {
            background-color: #0b0d12;
            border: 1px solid #333a4d;
            color: var(--accent-color);
            font-size: 1.2rem;
            width: 45px;
            height: 45px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .symbol-btn:hover {
            border-color: var(--accent-color);
            background-color: #1f2433;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            background-color: #0b0d12;
            border: 2px solid #333a4d;
            border-radius: 8px;
            color: var(--accent-color);
            font-size: 1.2rem;
            text-align: center;
            letter-spacing: 3px;
            padding: 10px;
            outline: none;
        }

        .submit-btn {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            padding: 0 20px;
            cursor: pointer;
            text-transform: uppercase;
        }

        .submit-btn:hover {
            background-color: var(--accent-hover);
        }

        .action-row {
            display: flex;
            justify-content: flex-end;
        }

        .clear-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.85rem;
            text-decoration: underline;
        }

        .clear-btn:hover {
            color: var(--error-color);
        }

        /* Nachrichten & Lösungskarten */
        .message-box {
            margin-top: 20px;
            min-height: 80px;
        }

        .alert.error {
            background-color: rgba(231, 76, 60, 0.15);
            border: 1px solid var(--error-color);
            color: var(--error-color);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
        }

        .solution-card {
            background-color: #1f2433;
            border: 1px solid var(--accent-color);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.1);
        }

        .solution-card h3 {
            color: var(--accent-color);
            margin-bottom: 8px;
            font-size: 1.1rem;
            border-bottom: 1px solid #333a4d;
            padding-bottom: 5px;
        }

        .solution-card p {
            color: var(--text-color);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        /* Modal für Tipps */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background-color: var(--panel-bg);
            border: 2px solid var(--accent-color);
            padding: 25px;
            border-radius: 12px;
            max-width: 400px;
            width: 90%;
        }

        .modal-content h3 {
            color: var(--accent-color);
            margin-bottom: 15px;
        }

        .modal-content p {
            color: var(--text-color);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .close-modal {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            float: right;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-top">
            <h1>EXIT – Dekoder</h1>
            <button class="tip-toggle-btn" onclick="toggleTips(true)">💡 Hinweise</button>
        </div>
        <p class="subtitle">Wähle zuerst das Rätsel-Symbol aus und gib den Code ein.</p>

        <!-- 1. Rätsel-Symbol auswählen (damit man verschiedene Rätsel auseinanderhalten kann) -->
        <div class="section-label">1. Welches Rätsel bearbeitest du?</div>
        <div class="puzzle-selector">
            <div class="puzzle-tab active" onclick="selectPuzzle('◯', this)">◯ Rätsel A</div>
            <div class="puzzle-tab" onclick="selectPuzzle('△', this)">△ Rätsel B</div>
            <div class="puzzle-tab" onclick="selectPuzzle('⭐', this)">⭐ Rätsel C</div>
        </div>

        <!-- 2. Code eingeben -->
        <div class="code-form">
            <div class="section-label">2. Gib den 3stelligen Code ein:</div>
            
            <div class="symbol-palette">
                <button class="symbol-btn" onclick="appendSymbol('1')">1</button>
                <button class="symbol-btn" onclick="appendSymbol('2')">2</button>
                <button class="symbol-btn" onclick="appendSymbol('3')">3</button>
                <button class="symbol-btn" onclick="appendSymbol('4')">4</button>
            </div>

            <div class="input-group">
                <input type="text" id="codeInput" readonly placeholder="---">
                <button class="submit-btn" onclick="checkCode()">Prüfen</button>
            </div>

            <div class="action-row">
                <button class="clear-btn" onclick="clearCode()">Eingabe löschen</button>
            </div>
        </div>

        <div class="message-box" id="messageBox"></div>
    </div>

    <!-- Tipp-Modal -->
    <div class="modal" id="tipModal">
        <div class="modal-content">
            <h3 id="tipTitle">Hinweise für Rätsel ◯</h3>
            <p id="tipText">Lade die Hinweise für das aktuelle Rätsel...</p>
            <button class="close-modal" onclick="toggleTips(false)">Schließen</button>
        </div>
    </div>

    <script>
        // Aktuell ausgewähltes Rätsel-Symbol
        let currentPuzzle = "◯";

        // Unterschiedliche Tipps für jedes Rätsel-Symbol
        const tipsData = {
            "◯": { title: "Hinweise: Rätsel ◯", text: "Tipp 1: Zähle die Symbole im Bild.<br>Tipp 2: Die Farbe des Rahmens gibt dir die Richtung vor." },
            "△": { title: "Hinweise: Rätsel △", text: "Tipp 1: Schaue dir die Zahlen genau an.<br>Tipp 2: Manchmal hilft spiegelverkehrtes Lesen." },
            "⭐": { title: "Hinweise: Rätsel ⭐", text: "Tipp 1: Der Weg führt über die Ecken.<br>Tipp 2: Ignoriere die kleinen Symbole nicht." }
        };

        // Verschiedene richtige Kombinationen pro Rätsel-Symbol
        const solutionsData = {
            "◯": {
                "123": { title: "Lösungskarte ◯ - 1", text: "Richtig! Du öffnest das erste Fach des Kreises und findest einen kleinen Schlüssel." }
            },
            "△": {
                "241": { title: "Lösungskarte △ - 1", text: "Ausgezeichnet! Das Dreieck-Rätsel ist gelöst. Ein versteckter Text erscheint." }
            },
            "⭐": {
                "432": { title: "Lösungskarte ⭐ - 1", text: "Klasse! Der Stern leuchtet auf und gibt den Weg in den nächsten Bereich frei." }
            }
        };

        function selectPuzzle(symbol, element) {
            currentPuzzle = symbol;
            // Aktiven Tab markieren
            document.querySelectorAll('.puzzle-tab').forEach(tab => tab.classList.remove('active'));
            element.classList.add('active');
            clearCode();
        }

        function appendSymbol(char) {
            const inputField = document.getElementById("codeInput");
            if (inputField.value.length < 3) {
                inputField.value += char;
            }
        }

        function clearCode() {
            document.getElementById("codeInput").value = "";
            document.getElementById("messageBox").innerHTML = "";
        }

        function toggleTips(show) {
            const modal = document.getElementById("tipModal");
            if (show) {
                document.getElementById("tipTitle").innerText = tipsData[currentPuzzle].title;
                document.getElementById("tipText").innerHTML = tipsData[currentPuzzle].text;
                modal.style.display = "flex";
            } else {
                modal.style.display = "none";
            }
        }

        function checkCode() {
            const inputField = document.getElementById("codeInput");
            const messageBox = document.getElementById("messageBox");
            const code = inputField.value.trim();

            if (code.length < 3) {
                messageBox.innerHTML = `<div class="alert error">Der Code muss 3 Zeichen lang sein!</div>`;
                return;
            }

            // Prüfen, ob für dieses Rätsel-Symbol dieser Code existiert
            if (solutionsData[currentPuzzle] && solutionsData[currentPuzzle][code]) {
                const card = solutionsData[currentPuzzle][code];
                messageBox.innerHTML = `
                    <div class="solution-card">
                        <h3>${card.title}</h3>
                        <p>${card.text}</p>
                    </div>
                `;
            } else {
                messageBox.innerHTML = `<div class="alert error">Falsch! Für das Symbol ${currentPuzzle} ist dieser Code ungültig.</div>`;
            }
        }
    </script>

</body>
</html>
